version: '3.8'

services:
  edusphere-db:
    image: postgres:15-alpine
    container_name: edusphere-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edusphere}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edusphere}"]
      interval: 10s
      timeout: 5s
      retries: 5

  edusphere-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edusphere-web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FACULTY_INVITE_KEY=${FACULTY_INVITE_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      edusphere-db:
        condition: service_healthy

volumes:
  postgres_data:
