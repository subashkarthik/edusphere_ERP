<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EduSphere — Universal University LMS System</title>
    <meta name="description" content="EduSphere: A high-performance, student-centric Universal University LMS System for courses, resources, and academic records.">
    <meta name="keywords" content="LMS, University Management, Student Portal, Course Management, Education Platform">
    <meta name="author" content="EduSphere">
    <meta name="theme-color" content="#050816">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduSphere LMS">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/EduSphere_Logo.png">
    <meta property="og:title" content="EduSphere — Universal University LMS System">
    <meta property="og:description" content="The ultimate student-centric institutional experience.">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════
           EDUSPHERE LIQUID GLASS DESIGN SYSTEM v2.0
           Apple macOS Liquid Glass — Dark Mode
        ═══════════════════════════════════════════════════ */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.10);
            --glass-bg-hover: rgba(255, 255, 255, 0.14);
            --glass-border: rgba(255, 255, 255, 0.16);
            --glass-border-hover: rgba(255, 255, 255, 0.26);
            --glass-blur: 24px;
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.04);
            --glass-shadow-hover: 0 24px 64px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.08);
            --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.1), inset 0 -1px 0 rgba(255,255,255,0.02);
            --accent: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --mouse-x: 50%;
            --mouse-y: 50%;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #050816;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ── Animated Universe Background ── */
        .glass-universe {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #050816;
        }
        .glass-universe::before {
            content: ''; position: absolute;
            width: 150%; height: 150%; top: -25%; left: -25%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(236, 72, 153, 0.06) 0%, transparent 40%);
            animation: meshFloat 25s ease-in-out infinite alternate;
            transform: translate3d(0, 0, 0); will-change: transform;
        }
        .glass-universe::after {
            content: ''; position: absolute; inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.5; pointer-events: none;
        }
        @keyframes meshFloat {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            50%  { transform: translate3d(-2%, 1%, 0) scale(1.02); }
            100% { transform: translate3d(1%, -1%, 0) scale(1); }
        }

        /* ── Glass Core ── */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), var(--glass-inset);
            position: relative; isolation: isolate;
            transform: translate3d(0, 0, 0);
        }
        .glass-hover {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.3s ease;
        }
        .glass-hover:hover {
            transform: translateY(-2px) scale(1.008) translate3d(0, 0, 0);
            box-shadow: var(--glass-shadow-hover), var(--glass-inset);
            border-color: var(--glass-border-hover);
        }

        /* ── Glass Sidebar & Header ── */
        .glass-sidebar {
            background: rgba(8, 12, 30, 0.85);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.5);
        }
        .glass-header {
            background: rgba(8, 12, 30, 0.7);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        /* ── Glass Glow (cursor-tracking via CSS vars set by JS) ── */
        .glass-glow::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(99,102,241,0.08), transparent 40%);
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none; z-index: 1;
        }
        .glass-glow:hover::before { opacity: 1; }

        /* ── Edge Highlight ── */
        .glass-edge::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1) 30%, rgba(255,255,255,0.06) 70%, transparent);
            pointer-events: none; z-index: 2;
        }

        /* ── Glass Input, Button ── */
        .glass-input {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
            color: #ffffff; outline: none; transition: all 0.3s ease;
        }
        .glass-input::placeholder { color: #cbd5e1; opacity: 1; }
        .glass-input:focus {
            border-color: rgba(99,102,241,0.7);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
            background: rgba(255,255,255,0.08);
        }
        .glass-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: #ffffff; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            transform: translate3d(0,0,0);
        }
        .glass-btn:hover {
            background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.25);
            transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }
        .glass-btn:active { transform: scale(0.97); }
        .glass-btn-primary {
            background: linear-gradient(135deg, rgba(99,102,241,0.85), rgba(79,70,229,0.9));
            border: 1px solid rgba(129,140,248,0.4);
            box-shadow: 0 4px 20px rgba(99,102,241,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .glass-btn-primary:hover {
            background: linear-gradient(135deg, rgba(99,102,241,0.95), rgba(79,70,229,1.0));
            box-shadow: 0 8px 32px rgba(99,102,241,0.5);
        }

        /* ── Glass Table ── */
        .glass-table thead { background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .glass-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.06); transition: background 0.2s ease; }
        .glass-table tbody tr:hover { background: rgba(255,255,255,0.05); }

        /* ── Status Badges ── */
        .badge-emerald { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
        .badge-rose { background: rgba(244,63,94,0.2); color: #fb7185; border: 1px solid rgba(244,63,94,0.3); }
        .badge-amber { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
        .badge-indigo { background: rgba(99,102,241,0.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.35); }

        /* ── Accessibility / Typography Contrast Enhancements ── */
        .text-slate-600 { color: #cbd5e1 !important; }
        .text-slate-500 { color: #e2e8f0 !important; }
        .text-slate-400 { color: #f8fafc !important; }
        .text-slate-300 { color: #ffffff !important; }
        .text-slate-200 { color: #ffffff !important; }
        .text-slate-100 { color: #ffffff !important; }
        .text-slate-50  { color: #ffffff !important; }

        .text-indigo-500 { color: #c7d2fe !important; }
        .text-indigo-400 { color: #e0e7ff !important; }
        .text-indigo-300 { color: #ffffff !important; }

        .text-rose-500 { color: #fecdd3 !important; }
        .text-rose-400 { color: #ffe4e6 !important; }

        .text-amber-500 { color: #fde68a !important; }
        .text-amber-400 { color: #fef3c7 !important; }

        .text-emerald-500 { color: #a7f3d0 !important; }
        .text-emerald-400 { color: #d1fae5 !important; }

        .text-teal-400 { color: #ccfbf1 !important; }
        .text-lime-400 { color: #f7fee7 !important; }

        .progress-glow { box-shadow: 0 0 8px currentColor; }
    </style>
</head>
<body class="text-slate-100 selection:bg-indigo-500/30">
    <div class="glass-universe"></div>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
<script>
    document.addEventListener('mousemove', (e) => {
        const { clientX, clientY } = e;
        const x = (clientX / window.innerWidth) * 100;
        const y = (clientY / window.innerHeight) * 100;
        document.documentElement.style.setProperty('--mouse-x', x + '%');
        document.documentElement.style.setProperty('--mouse-y', y + '%');
    });
</script>
</body>
</html>
